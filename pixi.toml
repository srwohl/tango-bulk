# tango-bulk builds against a *released, installed* cppTango package. That is a
# hard requirement of IMPLEMENTATION_SPEC.md 1.2, not a convenience: the whole
# point of the extraction is that this project cannot quietly depend on a patched
# cppTango. Taking cppTango from conda-forge is the cheapest way to keep that
# property honest on a developer machine.

[workspace]
name = "tango-bulk"
channels = ["conda-forge"]
# Linux only, deliberately. UCX does not support macOS and the spec forbids
# emitting stub APIs on platforms the data plane cannot serve.
platforms = ["linux-64"]
requires-pixi = ">=0.55"

[dependencies]
cmake = ">=3.18"
ninja = "*"
cxx-compiler = "*"
pkg-config = "*"
cpptango = ">=10.0"
ucx = ">=1.21"
catch2 = ">=3.1.1"
# TangoConfig.cmake calls find_dependency(cppzmq), and the conda cpptango
# package ships only the runtime, so the headers have to be asked for
# explicitly.  This is a property of the packaging, not of tango-bulk.
cppzmq = "*"
hdf5 = "*"

# The demo database.  PyDatabaseds is a pure-Python Tango database server backed
# by SQLite, so the examples get a real database without MySQL, a service, or
# root.  It is a demo convenience only: nothing in src/ or in the library's tests
# needs a database.
python = ">=3.11"
pytango = ">=10.0"
# The conda cpptango package ships libraries only, so tango_admin -- the tool the
# registration step is written against -- comes from its own package.
tango-admin = "*"

[pypi-dependencies]
pytango-db = "*"

[tasks]
# CMAKE_CXX_COMPILER is pinned explicitly.  conda's $CMAKE_ARGS sets the
# archiver, linker and strip to the conda toolchain but leaves the compiler to
# the $CXX environment variable, so a reconfigure that does not see $CXX picks up
# /usr/bin/g++ and links system objects with the conda ld against the conda
# sysroot.  That fails deep in libpthread with undefined GLIBC_PRIVATE symbols,
# which is a long way from its cause.
_configure = { cmd = [
    "cmake",
    "$CMAKE_ARGS",
    "-DCMAKE_CXX_COMPILER=$CXX",
    "-GNinja",
    "-DCMAKE_BUILD_TYPE=RelWithDebInfo",
    "-DBUILD_TESTING=ON",
    "-DTANGO_BULK_WARNINGS_AS_ERRORS=ON",
    "-DTANGO_BULK_BUILD_BENCHMARKS=ON",
    "-DTANGO_BULK_BUILD_EXAMPLES=ON",
    "-DCMAKE_INSTALL_PREFIX=\"$CONDA_PREFIX\"",
    "-S.",
    "-Bbuild",
] }
build = { cmd = "cmake --build build", depends-on = ["_configure"] }
test = { cmd = "ctest --test-dir build --output-on-failure", depends-on = ["build"] }

# The exported package is part of what this project ships, so there has to be a
# documented way to produce it.  Without one it is only ever exercised by
# whoever packages the library, which is how the installed target names came to
# disagree with the ones in the README.  CMAKE_INSTALL_PREFIX is $CONDA_PREFIX
# from _configure; pass --prefix to install somewhere else.
install = { cmd = "cmake --install build", depends-on = ["build"] }
clean = "rm -rf build build-asan build-tsan"

# The sweeps in tests/unit/test_protocol_malformed.cpp only prove the
# "never read past the supplied length" rule when a sanitizer is watching.
_configure-asan = { cmd = [
    "cmake",
    "$CMAKE_ARGS",
    "-DCMAKE_CXX_COMPILER=$CXX",
    "-GNinja",
    "-DCMAKE_BUILD_TYPE=Debug",
    "-DBUILD_TESTING=ON",
    "-DTANGO_BULK_SANITIZERS=address,undefined",
    "-DTANGO_BULK_BUILD_BENCHMARKS=ON",
    "-DTANGO_BULK_BUILD_EXAMPLES=ON",
    "-S.",
    "-Bbuild-asan",
] }
test-asan = { cmd = "ctest --test-dir build-asan --output-on-failure", depends-on = [
    "_build-asan",
] }
_build-asan = { cmd = "cmake --build build-asan", depends-on = ["_configure-asan"] }

# The layering check is a plain script so CI can run it without configuring or
# building anything.
layering = "python3 scripts/check_layering.py"

# Sanity check before benchmarking: which transports does this host actually have?
ucx-info = "ucx_info -d"

# The UCX suite over a real verbs transport.
#
# Everything else in this repository runs over shared memory or CMA, where a send
# completes inside the call.  rc_verbs is the first configuration where a send
# genuinely stays posted to a queue pair, and that difference alone found a
# use-after-free that -Werror, ASan, TSan and a 20-run soak all passed over
# (docs/EXTRACTION.md deviation 22).  It needs a verbs device: either RDMA
# hardware or Soft-RoCE, which any recent kernel can provide:
#
#     sudo modprobe rdma_rxe
#     sudo rdma link add rxe0 type rxe netdev <iface>
#
# Skips with a message rather than failing when no device is present, so it is
# safe to put in CI before the hardware is.
test-rdma = { cmd = "scripts/run_rdma_tests.sh", depends-on = ["build"] }

# Two-process throughput and payload verification over the real library.
# See benchmarks/README.md; results belong in docs/THROUGHPUT.md.
bench = { cmd = "benchmarks/sweep.sh", depends-on = ["build"] }

# --- the demo database -------------------------------------------------------
#
# `pixi run db` in one terminal, `pixi run db-setup` once in another, and then
# the example servers are started by hand -- see examples/README.md.  There are
# deliberately no tasks for the servers themselves: a device server is what a
# user of this library writes and launches, and hiding that behind a task would
# hide the only part of the setup that is theirs.
db = { cmd = "PyDatabaseds --logging_level=2 2", env = { PYTANGO_DATABASE_NAME = "demo-tango.db" } }

# Registers the two example servers.  Idempotent: --add-server overwrites the
# entry, so re-running it after a rename or a wiped database is safe.
db-setup = { cmd = """
    tango_admin --ping-database 30 &&
    tango_admin --add-server tango-bulk-example-device/demo ExampleDetector bulk/example/1 &&
    tango_admin --add-server tango-bulk-example-hdf5-device/demo Hdf5ReplayDetector bulk/hdf5/1 &&
    tango_admin --add-server tango-bulk-example-preview/demo PreviewDetector bulk/preview/1 &&
    tango_admin --check-device bulk/example/1 &&
    tango_admin --check-device bulk/hdf5/1 &&
    tango_admin --check-device bulk/preview/1
""" }

# Wipes the demo database.  The server holds it open, so stop `pixi run db` first.
db-clean = "rm -f demo-tango.db"

[activation.env]
# Every terminal in this environment -- the database, tango_admin, the example
# servers started by hand -- has to agree on where the database is.
#
# The host half does more than name the database.  PyDatabaseds takes no endpoint
# argument: it builds "giop:tcp:<host>:<port>" out of TANGO_HOST and hands that
# to omniORB, so this name is also the interface the database *binds*.
# "localhost" therefore binds loopback and nothing else -- correct for a demo on
# one machine, unreachable from a second one.  For a client on another host,
# change "localhost" here to this machine's own name and check with
# `ss -ltnp | grep :11000` that it is no longer listening on ::1 alone.
#
# Port 11000, not the customary 10000, so a real local Tango installation and
# this demo can coexist.
TANGO_HOST = "localhost:11000"
